<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cyberpunk Interactive Globe Matrix</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            cyan: '#00f0ff',
                            magenta: '#ff007f',
                            purple: '#7000ff',
                            dark: '#050714',
                            panel: 'rgba(10, 15, 30, 0.75)',
                            border: 'rgba(0, 240, 255, 0.3)'
                        }
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'JetBrains Mono', 'Consolas', 'monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Glowing & Scanline Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #050714;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 2px;
        }
        
        /* Cyber Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 240, 255, 0.03) 50%,
                rgba(0, 240, 255, 0.03)
            );
            background-size: 100% 4px;
        }

        /* Hologram Grid Animation */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6)); }
            50% { opacity: 0.9; filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.9)); }
        }

        .cyber-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Glassmorphism Panel */
        .cyber-glass {
            background: rgba(8, 12, 28, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        /* Marker Pulse Wave */
        @keyframes radar-ping {
            0% { transform: scale(0.8); opacity: 0.9; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .marker-ping {
            animation: radar-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
    </style>
</head>
<body class="bg-cyber-dark text-slate-100 font-sans h-full w-full overflow-hidden select-none">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

    <!-- Retro Cyber Scanline Texture Overlay -->
    <div class="pointer-events-none fixed inset-0 z-10 scanlines opacity-60"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-20 flex flex-col justify-between h-full w-full p-4 md:p-6 pointer-events-none">
        
        <!-- Header Panel -->
        <header class="flex justify-between items-start pointer-events-auto">
            <div class="cyber-glass p-4 rounded-xl max-w-md border-l-4 border-l-cyber-cyan shadow-lg">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-cyber-cyan/10 rounded-lg text-cyber-cyan border border-cyber-cyan/30">
                        <i data-lucide="globe" class="w-6 h-6 animate-spin" style="animation-duration: 12s;"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold font-mono tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyber-cyan via-blue-400 to-cyber-magenta">
                            CYBER-EARTH v3.0
                        </h1>
                        <p class="text-xs text-cyan-300/70 font-mono tracking-tight flex items-center gap-2">
                            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                            GLOBAL MATRIX TELEMETRY ONLINE
                        </p>
                    </div>
                </div>
            </div>

            <!-- Quick Action Toggle -->
            <div class="flex gap-2">
                <button id="btn-audio" title="Toggle Audio FX" class="cyber-glass p-3 rounded-xl hover:border-cyber-cyan transition-all text-slate-300 hover:text-cyber-cyan active:scale-95">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
                <button id="btn-reset-cam" title="Reset Camera View" class="cyber-glass p-3 rounded-xl hover:border-cyber-cyan transition-all text-slate-300 hover:text-cyber-cyan active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Interactive Node Info Card (Appears on Hover/Click) -->
        <div id="node-info-card" class="cyber-glass p-5 rounded-xl max-w-sm w-full mx-auto md:mx-0 self-center md:self-auto opacity-0 translate-y-4 transition-all duration-300 pointer-events-auto border-t-2 border-t-cyber-cyan">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-cyan-500/20">
                <span id="node-city" class="font-mono text-lg font-bold text-cyber-cyan">TAIPEI NODE</span>
                <span id="node-ping" class="text-xs font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">12ms</span>
            </div>
            <div class="space-y-2 text-xs font-mono text-slate-300">
                <div class="flex justify-between">
                    <span class="text-slate-400">COORDINATES:</span>
                    <span id="node-coords" class="text-cyan-200">25.0330° N, 121.5654° E</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">NETWORK TRAFFIC:</span>
                    <span id="node-traffic" class="text-emerald-300">4.82 TB/s</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">ACTIVE NODES:</span>
                    <span id="node-active" class="text-cyber-magenta">1,024 CONNECTIONS</span>
                </div>
            </div>
        </div>

        <!-- Footer / Control Panel Bar -->
        <footer class="flex flex-col md:flex-row justify-between items-center gap-4 pointer-events-auto">
            
            <!-- Realtime Metrics Badge -->
            <div class="cyber-glass px-4 py-2 rounded-xl text-xs font-mono flex items-center gap-4 text-slate-300 border-b-2 border-b-cyber-magenta">
                <div>FPS: <span id="val-fps" class="text-cyber-cyan font-bold">60</span></div>
                <div class="h-3 w-px bg-slate-700"></div>
                <div>NODES: <span class="text-emerald-400 font-bold">14,250</span></div>
                <div class="h-3 w-px bg-slate-700"></div>
                <div>ARCS: <span class="text-cyber-magenta font-bold">12 ACTIVE</span></div>
            </div>

            <!-- Control Buttons Trigger Tray -->
            <div class="cyber-glass p-2 rounded-2xl flex flex-wrap justify-center gap-2 border border-cyber-cyan/30">
                
                <button id="toggle-rotation" class="px-3 py-2 rounded-lg text-xs font-mono font-semibold bg-cyan-500/20 text-cyber-cyan border border-cyan-500/40 hover:bg-cyan-500/30 transition-all flex items-center gap-1.5">
                    <i data-lucide="pause" class="w-4 h-4"></i>
                    <span>AUTOROTATE</span>
                </button>

                <button id="toggle-grid" class="px-3 py-2 rounded-lg text-xs font-mono font-semibold bg-slate-800/80 text-slate-300 border border-slate-700 hover:border-cyber-cyan transition-all flex items-center gap-1.5">
                    <i data-lucide="grid" class="w-4 h-4"></i>
                    <span>GRID LINES</span>
                </button>

                <button id="toggle-arcs" class="px-3 py-2 rounded-lg text-xs font-mono font-semibold bg-slate-800/80 text-slate-300 border border-slate-700 hover:border-cyber-cyan transition-all flex items-center gap-1.5">
                    <i data-lucide="activity" class="w-4 h-4"></i>
                    <span>DATA ARCS</span>
                </button>

                <!-- Color Palette Switcher -->
                <div class="flex items-center gap-1 px-2 border-l border-slate-700/80">
                    <button data-theme="neon" class="theme-btn w-6 h-6 rounded-full bg-cyan-400 border-2 border-white/80 transition-transform hover:scale-110 active:scale-95" title="Cyber Cyan"></button>
                    <button data-theme="synth" class="theme-btn w-6 h-6 rounded-full bg-fuchsia-500 border-2 border-transparent hover:border-white/80 transition-transform hover:scale-110 active:scale-95" title="Synthwave Pink"></button>
                    <button data-theme="matrix" class="theme-btn w-6 h-6 rounded-full bg-emerald-400 border-2 border-transparent hover:border-white/80 transition-transform hover:scale-110 active:scale-95" title="Matrix Green"></button>
                    <button data-theme="solar" class="theme-btn w-6 h-6 rounded-full bg-amber-400 border-2 border-transparent hover:border-white/80 transition-transform hover:scale-110 active:scale-95" title="Solar Gold"></button>
                </div>
            </div>
        </footer>
    </div>

    <!-- MAIN THREE.JS HOLOGRAPHIC GLOBE LOGIC -->
    <script>
        // --- System State & Themes ---
        const state = {
            autoRotate: true,
            showGrid: true,
            showArcs: true,
            audioEnabled: false,
            rotationSpeed: 0.0012,
            currentTheme: 'neon'
        };

        const THEMES = {
            neon: {
                cyan: 0x00f0ff,
                magenta: 0xff007f,
                globeDot: 0x00f0ff,
                grid: 0x0044aa,
                atmosphere: 0x0088ff,
                arc: [0x00f0ff, 0xff007f]
            },
            synth: {
                cyan: 0xff00aa,
                magenta: 0x9900ff,
                globeDot: 0xff00cc,
                grid: 0x5500aa,
                atmosphere: 0xaa00ff,
                arc: [0xff00aa, 0xffff00]
            },
            matrix: {
                cyan: 0x00ff66,
                magenta: 0x003311,
                globeDot: 0x00ff66,
                grid: 0x005522,
                atmosphere: 0x00cc44,
                arc: [0x00ff66, 0xbbff00]
            },
            solar: {
                cyan: 0xffaa00,
                magenta: 0xff3300,
                globeDot: 0xffbb00,
                grid: 0x884400,
                atmosphere: 0xff6600,
                arc: [0xffaa00, 0xff0055]
            }
        };

        // Major Global Tech Hub Hubs Data (Latitude, Longitude, City Name, Info)
        const CITIES = [
            { name: "TAIPEI", lat: 25.0330, lng: 121.5654, ping: "8ms", traffic: "9.4 TB/s" },
            { name: "TOKYO", lat: 35.6762, lng: 139.6503, ping: "24ms", traffic: "14.2 TB/s" },
            { name: "SINGAPORE", lat: 1.3521, lng: 103.8198, ping: "32ms", traffic: "8.1 TB/s" },
            { name: "SAN FRANCISCO", lat: 37.7749, lng: -122.4194, ping: "110ms", traffic: "18.6 TB/s" },
            { name: "NEW YORK", lat: 40.7128, lng: -74.0060, ping: "145ms", traffic: "15.9 TB/s" },
            { name: "LONDON", lat: 51.5074, lng: -0.1278, ping: "180ms", traffic: "12.4 TB/s" },
            { name: "BERLIN", lat: 52.5200, lng: 13.4050, ping: "192ms", traffic: "7.8 TB/s" },
            { name: "SYDNEY", lat: -33.8688, lng: 151.2093, ping: "135ms", traffic: "5.3 TB/s" }
        ];

        // --- Core Three.js Variables ---
        let scene, camera, renderer, controls;
        let globeGroup, dotMatrixPoints, gridMesh, atmosphereMesh, arcGroup, markersGroup, particleField;
        let raycaster, mouse;
        let clock = new THREE.Clock();
        let frameCount = 0, fpsTimer = 0;

        // --- Web Audio API (Synthesized Cyber Click Effects) ---
        let audioCtx = null;
        function playBeep(freq = 880, type = 'sine', duration = 0.08) {
            if (!state.audioEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.warn('Audio play error', e);
            }
        }

        // --- Utility: Convert Lat/Lng to 3D Sphere Vectors ---
        function latLngToVector3(lat, lng, radius, altitude = 0) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            const r = radius + altitude;
            return new THREE.Vector3(
                -(r * Math.sin(phi) * Math.cos(theta)),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
        }

        // --- Step 1: Initialize Scene & Camera ---
        function initScene() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050714, 0.0015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 280);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.minDistance = 120;
            controls.maxDistance = 450;
            controls.autoRotate = state.autoRotate;
            controls.autoRotateSpeed = 0.8;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0x00f0ff, 1.5);
            dirLight1.position.set(100, 200, 100);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xff007f, 1.2);
            dirLight2.position.set(-100, -200, -100);
            scene.add(dirLight2);

            globeGroup = new THREE.Group();
            scene.add(globeGroup);
        }

        // --- Step 2: Create Dynamic Dot Matrix Earth ---
        function createHologramGlobe() {
            const GLOBE_RADIUS = 80;
            const DOT_COUNT = 12000;
            
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];

            const theme = THEMES[state.currentTheme];
            const baseColor = new THREE.Color(theme.globeDot);
            const secondaryColor = new THREE.Color(theme.magenta);

            // Generate structured sphere distribution with coastline density algorithm simulation
            for (let i = 0; i < DOT_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / DOT_COUNT);
                const theta = Math.sqrt(DOT_COUNT * Math.PI) * phi;

                const lat = 90 - (phi * 180 / Math.PI);
                const lng = (theta * 180 / Math.PI) % 360 - 180;

                // High resolution continents filtering algorithm
                if (isLandmass(lat, lng)) {
                    const vec = latLngToVector3(lat, lng, GLOBE_RADIUS);
                    positions.push(vec.x, vec.y, vec.z);

                    // Color variation based on latitude
                    const mixRatio = Math.abs(lat) / 90;
                    const c = baseColor.clone().lerp(secondaryColor, mixRatio * 0.5);
                    colors.push(c.r, c.g, c.b);

                    sizes.push(1.2 + Math.random() * 1.5);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Custom Glowing Dot Shader Material
            const texture = createCircleTexture();
            const material = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                map: texture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            dotMatrixPoints = new THREE.Points(geometry, material);
            globeGroup.add(dotMatrixPoints);

            // Wireframe Neon Latitude/Longitude Grid Lines
            const gridGeo = new THREE.SphereGeometry(GLOBE_RADIUS + 0.2, 36, 18);
            const gridMat = new THREE.MeshBasicMaterial({
                color: theme.grid,
                wireframe: true,
                transparent: true,
                opacity: 0.2
            });
            gridMesh = new THREE.Mesh(gridGeo, gridMat);
            globeGroup.add(gridMesh);

            // Atmosphere Glowing Inner Core
            const coreGeo = new THREE.SphereGeometry(GLOBE_RADIUS - 0.5, 64, 64);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0x04081c,
                transparent: true,
                opacity: 0.9
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            globeGroup.add(coreMesh);

            // Atmospheric Outer Halo Shader
            createAtmosphere(GLOBE_RADIUS);
        }

        // Simple Math Procedural Landmass Checker
        function isLandmass(lat, lng) {
            // Simulated continents bounding algorithm for realistic land dot matrix
            const inAmericas = (lat > -55 && lat < 70 && lng > -130 && lng < -35);
            const inEurasia = (lat > 0 && lat < 75 && lng > -10 && lng < 150);
            const inAfrica = (lat > -35 && lat < 37 && lng > -20 && lng < 52);
            const inAustralia = (lat > -45 && lat < -10 && lng > 110 && lng < 155);
            
            // Random Noise filter for coastline detail
            const noise = (Math.sin(lat * 0.2) * Math.cos(lng * 0.2) + Math.sin(lng * 0.1)) > -0.2;
            
            return (inAmericas || inEurasia || inAfrica || inAustralia) && noise;
        }

        // Circular Smooth Glowing Texture Generator
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(0, 240, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // Outer Atmosphere Glow
        function createAtmosphere(radius) {
            const atmosphereGeo = new THREE.SphereGeometry(radius * 1.15, 64, 64);
            const atmosphereMat = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.5);
                        gl_FragColor = vec4(0.0, 0.8, 1.0, 1.0) * intensity;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });
            atmosphereMesh = new THREE.Mesh(atmosphereGeo, atmosphereMat);
            globeGroup.add(atmosphereMesh);
        }

        // --- Step 3: Tech Hub Markers & Interactive Nodes ---
        function createCityMarkers() {
            markersGroup = new THREE.Group();
            const GLOBE_RADIUS = 80;

            CITIES.forEach((city, index) => {
                const pos = latLngToVector3(city.lat, city.lng, GLOBE_RADIUS, 1.5);

                // Marker Glowing Dot
                const markerGeo = new THREE.SphereGeometry(1.2, 16, 16);
                const markerMat = new THREE.MeshBasicMaterial({
                    color: index === 0 ? 0xff007f : 0x00f0ff,
                    transparent: true,
                    opacity: 0.9
                });
                const markerMesh = new THREE.Mesh(markerGeo, markerMat);
                markerMesh.position.copy(pos);
                markerMesh.userData = { city: city, index: index };

                // Pulsing Ring Beacon
                const ringGeo = new THREE.RingGeometry(1.5, 2.5, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: index === 0 ? 0xff007f : 0x00f0ff,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.6
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.position.copy(pos);
                ringMesh.lookAt(new THREE.Vector3(0,0,0));
                ringMesh.userData = { isRing: true };

                markersGroup.add(markerMesh);
                markersGroup.add(ringMesh);
            });

            globeGroup.add(markersGroup);
        }

        // --- Step 4: 3D Flight / Data Arcs ---
        function createDataArcs() {
            arcGroup = new THREE.Group();
            const GLOBE_RADIUS = 80;
            const taipei = CITIES[0]; // Center connections from Taipei Node

            for (let i = 1; i < CITIES.length; i++) {
                const target = CITIES[i];
                const startVec = latLngToVector3(taipei.lat, taipei.lng, GLOBE_RADIUS);
                const endVec = latLngToVector3(target.lat, target.lng, GLOBE_RADIUS);

                // Calculate Arc Height midpoint vector
                const distance = startVec.distanceTo(endVec);
                const midVec = startVec.clone().add(endVec).multiplyScalar(0.5);
                const midLength = midVec.length();
                midVec.normalize().multiplyScalar(GLOBE_RADIUS + distance * 0.35);

                // Quadratic Bezier Curve
                const curve = new THREE.QuadraticBezierCurve3(startVec, midVec, endVec);
                const points = curve.getPoints(50);
                const arcGeo = new THREE.BufferGeometry().setFromPoints(points);

                const theme = THEMES[state.currentTheme];
                const arcMat = new THREE.LineBasicMaterial({
                    color: i % 2 === 0 ? theme.cyan : theme.magenta,
                    transparent: true,
                    opacity: 0.55,
                    linewidth: 1.5
                });

                const arcLine = new THREE.Line(arcGeo, arcMat);
                arcGroup.add(arcLine);
            }

            globeGroup.add(arcGroup);
        }

        // --- Step 5: Ambient Cyber Space Dust Particles ---
        function createSpaceParticles() {
            const particleCount = 600;
            const geometry = new THREE.BufferGeometry();
            const positions = [];

            for (let i = 0; i < particleCount; i++) {
                const x = (Math.random() - 0.5) * 600;
                const y = (Math.random() - 0.5) * 600;
                const z = (Math.random() - 0.5) * 600;
                positions.push(x, y, z);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0x00f0ff,
                size: 1.2,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });

            particleField = new THREE.Points(geometry, material);
            scene.add(particleField);
        }

        // --- Step 6: Dynamic UI Interaction & Raycasting ---
        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markersGroup.children);

            const card = document.getElementById('node-info-card');

            if (intersects.length > 0 && !intersects[0].object.userData.isRing) {
                const city = intersects[0].object.userData.city;
                document.getElementById('node-city').innerText = `${city.name} NODE`;
                document.getElementById('node-ping').innerText = city.ping;
                document.getElementById('node-coords').innerText = `${city.lat.toFixed(2)}° N, ${city.lng.toFixed(2)}° E`;
                document.getElementById('node-traffic').innerText = city.traffic;
                
                card.classList.remove('opacity-0', 'translate-y-4');
                card.classList.add('opacity-100', 'translate-y-0');

                document.body.style.cursor = 'pointer';
                playBeep(1200, 'sine', 0.04);
            } else {
                card.classList.remove('opacity-100', 'translate-y-0');
                card.classList.add('opacity-0', 'translate-y-4');
                document.body.style.cursor = 'default';
            }
        }

        // --- Step 7: Animation & Render Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // FPS Calculation
            frameCount++;
            fpsTimer += delta;
            if (fpsTimer >= 1.0) {
                document.getElementById('val-fps').innerText = frameCount;
                frameCount = 0;
                fpsTimer = 0;
            }

            // Auto Rotation & Orbit Update
            controls.update();

            if (state.autoRotate && globeGroup) {
                globeGroup.rotation.y += state.rotationSpeed;
            }

            // Animate Marker Rings Pulsing
            if (markersGroup) {
                markersGroup.children.forEach(child => {
                    if (child.userData.isRing) {
                        child.scale.x = 1 + Math.sin(clock.getElapsedTime() * 3) * 0.25;
                        child.scale.y = 1 + Math.sin(clock.getElapsedTime() * 3) * 0.25;
                    }
                });
            }

            // Slow Space Dust Rotation
            if (particleField) {
                particleField.rotation.y += 0.0002;
                particleField.rotation.x += 0.0001;
            }

            renderer.render(scene, camera);
        }

        // --- Step 8: Responsive Resize Handler ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Step 9: Theme Switcher Engine ---
        function applyTheme(themeKey) {
            if (!THEMES[themeKey]) return;
            state.currentTheme = themeKey;
            const theme = THEMES[themeKey];

            // Update Grid Mesh Color
            if (gridMesh) gridMesh.material.color.setHex(theme.grid);

            // Update Arcs
            if (arcGroup) {
                arcGroup.children.forEach((arc, i) => {
                    arc.material.color.setHex(i % 2 === 0 ? theme.cyan : theme.magenta);
                });
            }

            // Update Theme Buttons UI Highlight
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-white');
                if (btn.dataset.theme === themeKey) {
                    btn.classList.add('ring-2', 'ring-white');
                }
            });

            playBeep(960, 'triangle', 0.1);
        }

        // --- DOM Initialization & Listener Attachments ---
        window.onload = function() {
            initScene();
            createHologramGlobe();
            createCityMarkers();
            createDataArcs();
            createSpaceParticles();

            // Initialize Icons
            lucide.createIcons();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointermove', onPointerMove);

            // Controls Toggles
            document.getElementById('toggle-rotation').addEventListener('click', function() {
                state.autoRotate = !state.autoRotate;
                controls.autoRotate = state.autoRotate;
                this.classList.toggle('bg-cyan-500/20');
                this.classList.toggle('text-cyber-cyan');
                playBeep(state.autoRotate ? 880 : 440, 'sine', 0.08);
            });

            document.getElementById('toggle-grid').addEventListener('click', function() {
                state.showGrid = !state.showGrid;
                gridMesh.visible = state.showGrid;
                this.classList.toggle('border-cyber-cyan');
                playBeep(600, 'sine', 0.05);
            });

            document.getElementById('toggle-arcs').addEventListener('click', function() {
                state.showArcs = !state.showArcs;
                arcGroup.visible = state.showArcs;
                this.classList.toggle('border-cyber-cyan');
                playBeep(650, 'sine', 0.05);
            });

            document.getElementById('btn-audio').addEventListener('click', function() {
                state.audioEnabled = !state.audioEnabled;
                this.classList.toggle('text-cyber-cyan');
                this.classList.toggle('border-cyber-cyan');
                playBeep(1000, 'sine', 0.1);
            });

            document.getElementById('btn-reset-cam').addEventListener('click', function() {
                camera.position.set(0, 30, 280);
                controls.target.set(0, 0, 0);
                controls.update();
                playBeep(750, 'triangle', 0.08);
            });

            // Theme Buttons
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    applyTheme(e.target.dataset.theme);
                });
            });

            // Start Main Animation Loop
            animate();
        };
    </script>
</body>
</html>
